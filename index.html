let activeFilter='全部';
// 注意：这里必须限定在 #filters 容器内，推荐机型区的 .filter（data-size）不能被覆盖绑定
function renderFilters(){
  const fs=['全部','轻办公型','数据分析型','程序开发型','工程设计型','创作/AI型'];
  document.getElementById('filters').innerHTML=fs.map(f=>`<button class="filter ${f===activeFilter?'active':''}" type="button" data-filter="${f}" aria-pressed="${f===activeFilter}">${f}</button>`).join('');
  document.querySelectorAll('#filters .filter').forEach(b=>{
    b.addEventListener('click',()=>{activeFilter=b.dataset.filter;renderFilters();renderMajors()});
  });
}
// 搜索时也匹配该专业可选机型名，方便搜"拯救者"反查专业
function getFiltered(){const q=document.getElementById('search').value.trim().toLowerCase();return majors.filter(m=>(activeFilter==='全部'||m[1]===activeFilter)&&(!q||(m.join(' ')+' '+recFor(m).map(id=>byId[id].name).join(' ')).toLowerCase().includes(q)))}
// 按专业需求把「所有符合条件」的机型算出来，而不是每台手写几台
const POOL={
  thin:['xiaoxinair14','xiaoxin16se','wuwei16se','redmibook14','honorx16','adou14air','zhan66'],
  pro:['xiaoxinpro16','thinkbookp'],
  gpu:['tianxuan7pro','y7000p','y7000x','y9000p','r9000p','omenpro16','jiaolong16pro','tianxuan6pro','rogmoba','jiguangx','douzhanzhe'],
  mac:['macbookair','macbookneo','mbp14']
};
const MAC_LIBERAL=new Set(['汉语言文学','历史学','哲学','法学','英语','教育学','新闻学','社会学']);
const MAC_CREATIVE=new Set(['广播电视学','数字媒体艺术','动画','影视摄影与制作','视觉传达设计']);
const NO_MAC=new Set(['人工智能','游戏设计']); // 本地 CUDA / UE 项目，Mac 不合适
const ORDER=series.map(s=>s.id);
function recFor(m){
  const name=m[0],type=m[1],gpu=m[4];
  let ids;
  if(gpu==='yes'){
    ids=POOL.gpu.slice();
    if(type==='创作/AI型'&&MAC_CREATIVE.has(name))ids.push('mbp14');
  }else if(gpu==='maybe'){
    ids=[...POOL.pro,...POOL.gpu];
    if(MAC_CREATIVE.has(name))ids.push('mbp14');
    if(MAC_LIBERAL.has(name))ids.push('macbookair','macbookneo');
  }else{
    ids=[...POOL.thin,...POOL.pro];
    if(MAC_LIBERAL.has(name))ids.push('macbookair','macbookneo');
  }
  if(NO_MAC.has(name))ids=ids.filter(i=>i!=='mbp14'&&i!=='macbookair'&&i!=='macbookneo');
  return [...new Set(ids)].filter(id=>byId[id]).sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b));
}
function groupedIds(ids){
  const cats=[['轻薄办公本','轻薄办公本'],['高性能笔记本','高性能笔记本'],['Mac（Apple 芯片）','Mac']];
  return cats.map(([label,cat])=>[label,ids.filter(id=>byId[id]&&byId[id].cat===cat)]).filter(([,list])=>list.length);
}
function recOptions(ids){
  if(!ids.length)return '';
  const html=groupedIds(ids).map(([label,list])=>`<optgroup label="${label}">${list.map(id=>`<option value="${id}">${byId[id].name}</option>`).join('')}</optgroup>`).join('');
  return `<select class="rec-select" aria-label="推荐机型"><option value="">选择推荐机型（${ids.length} 款）</option>${html}</select>`;
}
function renderMajors(){const rows=getFiltered();document.getElementById('majorBody').innerHTML=rows.map(m=>`<tr data-major="${m[0]}"><td><strong>${m[0]}</strong></td><td><span class="chip">${m[1]}</span></td><td>${m[2].split('、').map(s=>`<span class="chip">${s}</span>`).join('')}</td><td>${recOptions(recFor(m))}</td></tr>`).join('');document.getElementById('empty').style.display=rows.length?'none':'block'}
function setCat(c){activeCat=c;document.querySelectorAll('[data-cat]').forEach(x=>{const on=x.dataset.cat===c;x.classList.toggle('active',on);x.setAttribute('aria-pressed',String(on))})}
function setSize(z){activeSize=z;document.querySelectorAll('[data-size]').forEach(x=>{const on=x.dataset.size===z;x.classList.toggle('active',on);x.setAttribute('aria-pressed',String(on))})}
// 下拉菜单主导展示：选中某机型时只渲染那一台，并隐藏无关的筛选栏
function showBars(v){
  const cb=document.getElementById('catBar');
  if(cb)cb.hidden=!v;
}
function viewAll(){
  activeSeries=null;
  document.querySelectorAll('.rec-select').forEach(sel=>{sel.value=''});
  showBars(true);renderRecs();
}
function jumpToSeries(id){
  const s=byId[id];if(!s)return;
  if(!activeSeries){ // 浏览全部时，先把类别筛选放宽到能显示它，避免返回后状态错乱
    if(activeCat!=='全部'&&s.cat!==activeCat)setCat('全部');
  }
  activeSeries=id;
  showBars(false);
  renderRecs();
  const el=document.querySelector('.rec[data-series="'+id+'"]');
  if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:'center'});
  el.classList.add('flash');
  clearTimeout(window.__flashTimer);
  window.__flashTimer=setTimeout(()=>el.classList.remove('flash'),2200);
}
const byId=Object.fromEntries(series.map(s=>[s.id,s]));
let activeSize='全部尺寸',activeCat='全部',activeSeries=null;
const picked={}; // 用户在卡片内手动切换的版本序号
function variantIndex(s){
  if(activeSize!=='全部尺寸'){
    const i=s.variants.findIndex(v=>v.grp===activeSize);
    if(i>=0)return i;
  }
  const p=picked[s.id];
  if(typeof p==='number'&&p<s.variants.length&&(activeSize==='全部尺寸'||s.variants[p].grp===activeSize))return p;
  const d=s.variants.findIndex(v=>v.size===s.pick);
  return d>=0?d:0;
}
// 卡片配置列表：内存 / SSD 跨所有在售版本聚合成档位（如 16G/32G、512GB/1TB），其余参数跟随当前选中版本
function aggMemSsd(s,key){
  const mems=new Set(),ssds=new Set();
  s.variants.forEach(v=>{
    const f=v.spec.find(x=>x[0]===key);if(!f)return;
    if(key==='内存')(f[1].match(/\d+GB/g)||[]).forEach(x=>mems.add(parseInt(x)));
    else (f[1].match(/512GB|\d+TB/g)||[]).forEach(x=>ssds.add(x));
  });
  if(key==='内存')return mems.size?[...mems].sort((a,b)=>a-b).join('G/')+'G':'';
  const ord={'512GB':0,'1TB':1,'2TB':2,'4TB':3};
  return ssds.size?[...ssds].sort((a,b)=>ord[a]-ord[b]).join('/'):'';
}
// 卡片配置列表：内存 / SSD 优先展示厂家产品线档位（series.mem / series.ssd），
// 未标注的机型回退为跨 variants 聚合；其余参数跟随当前选中版本
function memSsdOf(s,key){
  if(key==='内存')return Array.isArray(s.mem)?s.mem.slice().sort((a,b)=>a-b).join('G/')+'G':aggMemSsd(s,key);
  return Array.isArray(s.ssd)?s.ssd.join('/'):aggMemSsd(s,key);
}
function renderRecs(){
 // 排版规则：浏览全部时 Mac 类统一排在最后，其余按榜单原序
 const base=activeSeries?series.filter(s=>s.id===activeSeries)
  :series.filter(s=>(activeCat==='全部'||s.cat===activeCat)&&(activeSize==='全部尺寸'||s.variants.some(v=>v.grp===activeSize)));
 const rows=base.slice().sort((a,b)=>(a.cat==='Mac')-(b.cat==='Mac'));
 const cnt=document.getElementById('recCount');if(cnt)cnt.textContent=String(rows.length);
 const grid=document.getElementById('recGrid');if(grid)grid.classList.toggle('single',!!activeSeries);
 document.getElementById('recGrid').innerHTML=rows.map(s=>{
  const vi=variantIndex(s),v=s.variants[vi];
  // 应用户要求：不做尺寸切换 Tab，厂家提供的全部尺寸统一标在产品照右下角
  const byInch=(a,b)=>parseInt(a)-parseInt(b);
  const uniqByInch=arr=>{const m=new Map();arr.forEach(x=>{const k=parseInt(x);if(!m.has(k))m.set(k,x)});return [...m.values()].sort(byInch)};
  const allSize=uniqByInch(s.variants.map(x=>x.size)).join(' / ');
  const allScreen=uniqByInch(s.variants.map(x=>{const f=x.spec.find(y=>y[0]==='屏幕');return f?f[1]:''}).filter(Boolean)).join(' / ');
  // 应用户要求：页面不显示任何笔记本图片，全部用品牌占位块
  // 图片白名单：仅渲染用户已确认提供产品照的机型，其余保持品牌占位块
  const SHOW_IMGS=['zhan66','xiaoxin16se','tianxuan7pro','adou14air','honorx16','redmibook14','thinkbookp','xiaoxinpro16','wuwei16se','xiaoxinair14','y7000x','tianxuan6pro','y7000p','jiguangx','y9000p','r9000p','omenpro16','rogmoba','jiaolong16pro','douzhanzhe','macbookair','macbookneo','mbp14'];
  const thumb=SHOW_IMGS.some(k=>v.img&&v.img.indexOf(k)>=0)?`<img src="${v.img}" alt="${s.name} ${v.size}" loading="lazy" decoding="async" width="300" height="172">`:`<span class="thumb-fallback">${s.brand}</span>`;
  return `<article class="rec" data-series="${s.id}"><div class="thumb">${thumb}<span class="label">${s.cat==='Mac'?s.brand:s.cat+' · '+s.brand}</span>${s.ver?`<span class="ov-tr"><span class="ovb ov-ver">${s.ver}</span></span>`:''}<span class="ov-br"><span class="ovb ov-size">${allSize}</span>${s.warn?`<button type="button" class="warn-badge" aria-expanded="false" title="点击查看购买提醒">⚠</button>`:''}</span></div><h3>${s.name}</h3>${s.warn?`<div class="warn" hidden>⚠ ${s.warn}</div>`:''}<dl>${v.spec.map(x=>{let val=x[1];if(x[0]==='内存'||x[0]==='SSD'){const a=memSsdOf(s,x[0]);if(a)val=a}if(x[0]==='屏幕'&&allScreen)val=allScreen;return `<dt>${x[0]}</dt><dd>${val}</dd>`}).join('')}</dl><div class="actions"><a class="single" href="${v.url}" target="_blank" rel="noopener">查看京东自营实时价格</a></div></article>`
 }).join('');
 document.querySelectorAll('.variant-tab[data-series]').forEach(b=>b.addEventListener('click',()=>{picked[b.dataset.series]=Number(b.dataset.variant);renderRecs()}));
 document.querySelectorAll('.warn-badge').forEach(b=>b.addEventListener('click',()=>{const w=b.closest('.rec').querySelector('.warn');const willHide=!w.hidden;w.hidden=willHide;b.setAttribute('aria-expanded',String(!willHide));}));
}
document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{setCat(b.dataset.cat);renderRecs()}));
// 微信按钮：悬停即显示（CSS），点击可切换（适配触屏）
const wxWrap=document.getElementById('wxWrap'),wxBtn=document.getElementById('wxBtn');
if(wxBtn&&wxWrap){wxBtn.addEventListener('click',()=>{const on=wxWrap.classList.toggle('open');wxBtn.setAttribute('aria-expanded',String(on))});document.addEventListener('click',e=>{if(!wxWrap.contains(e.target)){wxWrap.classList.remove('open');wxBtn.setAttribute('aria-expanded','false')}})}
// 专业表里每一行一个下拉：选定机型后跳到推荐区并只展示那一台
document.getElementById('majorBody').addEventListener('change',e=>{
  const sel=e.target.closest('.rec-select');
  if(!sel)return;
  if(sel.value)jumpToSeries(sel.value); // 选回占位项不处理，避免误认为要返回全部
});
document.getElementById('searchBtn').addEventListener('click',()=>{activeFilter='全部';renderFilters();renderMajors();document.getElementById('majors').scrollIntoView({behavior:'smooth',block:'start'});});
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('searchBtn').click()}});
renderFilters();renderMajors();renderRecs();
</script>
</body>
</html>
